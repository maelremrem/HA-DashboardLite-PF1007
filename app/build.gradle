plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.maelab.haframe'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.maelab.haframe'
        minSdk 23
        targetSdk 28
        versionCode 5
        versionName '0.5.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:3.12.13'
}
